version: "3"
silent: true

# Astro site: `dir` + `pnpm --dir` keep the package root at `web/` so `.env` (if present)
# loads from this directory. Task does not support `dotenv:` in included Taskfiles.

vars:
  PKG_MGR: pnpm

tasks:
  # Refuse to start where something is already answering, and say what holds it. Every port here
  # is written down — in a config, in the table of what answers where, in an instruction — so a
  # busy one is not a thing to work around: Astro quietly takes the next port up and leaves every
  # instruction naming this one wrong, Vite refuses with a message that names no process, and a
  # second node fails to bind at all. Each of those is the same fact said badly, and the fact is
  # that the last run never stopped.
  #
  # PORTS is a list, each entry a port or a `host:port`. Where there is no `lsof` — Windows, where
  # Task runs these commands itself — nothing is asked and nothing is said, because a check that
  # cannot run is not a reason to refuse.
  ports:
    internal: true
    silent: true
    cmds:
      - |
        command -v lsof >/dev/null 2>&1 || exit 0
        held=""
        for entry in {{.PORTS}}; do
          port="${entry##*:}"
          # `|| true` twice: lsof exits 1 where it matches nothing, and a free port is the
          # ordinary case rather than a failure.
          pids="$({ lsof -nP -iTCP:"$port" -sTCP:LISTEN -t 2>/dev/null || true; lsof -nP -iUDP:"$port" -t 2>/dev/null || true; } | sort -u)"
          [ -n "$pids" ] || continue
          [ -n "$held" ] || printf '\nSomething is already answering:\n\n'
          for pid in $pids; do
            printf '  %-5s  pid %-7s %s\n' "$port" "$pid" "$(ps -p "$pid" -o user=,etime=,command= 2>/dev/null | cut -c1-86)"
            case " $held " in *" $pid "*) ;; *) held="$held $pid" ;; esac
          done
        done
        [ -n "$held" ] || exit 0
        printf '\nThe ports are fixed, so nothing here moves to the next one up. Stop that and run\nthis again:\n\n  kill%s\n\nStill there a moment later:\n\n  kill -9%s\n\n' "$held" "$held"
        exit 1

  default:
    desc: List available tasks
    dir: "{{.TASKFILE_DIR}}"
    cmds:
      - task --list

  install:
    desc: Install dependencies
    dir: "{{.TASKFILE_DIR}}"
    cmds:
      - echo "Installing web dependencies (pnpm)..."
      - '{{.PKG_MGR}} --dir "{{.TASKFILE_DIR}}" install'

  # `check` and `format` exist here because they exist everywhere: `task` is the surface, and a
  # repository missing one of them is a repository where the closing check cannot run. This one
  # went without for long enough that a broken type import sat in its layout unnoticed.
  check:
    desc: Type-check, lint, check formatting and run the suites
    dir: "{{.TASKFILE_DIR}}"
    cmds:
      - echo "Checking web (astro check, eslint, prettier)..."
      - '{{.PKG_MGR}} --dir "{{.TASKFILE_DIR}}" run check'
      - '{{.PKG_MGR}} --dir "{{.TASKFILE_DIR}}" run lint'
      - '{{.PKG_MGR}} --dir "{{.TASKFILE_DIR}}" run format:check'
      # Last, and inside: a check that left the suites out would be one a change could run in
      # full and still be half done. `test` builds first, because the suites read `dist/` —
      # what a reader is shown is what shipped, not the file it came from.
      - task: test

  format:
    desc: Format the source with Prettier
    dir: "{{.TASKFILE_DIR}}"
    cmds:
      - echo "Formatting web sources (Prettier)..."
      - '{{.PKG_MGR}} --dir "{{.TASKFILE_DIR}}" run format'

  build:
    desc: Build static site
    dir: "{{.TASKFILE_DIR}}"
    cmds:
      - echo "Building web static site (Astro)..."
      - '{{.PKG_MGR}} --dir "{{.TASKFILE_DIR}}" run build'

  # Depends on `build` because what is tested is the script the built page actually ships, not the
  # source it came from: the reader's language is decided by what was published.
  test:
    desc: Check what the built site does about language
    dir: "{{.TASKFILE_DIR}}"
    deps: [build]
    cmds:
      - echo "Testing web (node:test)..."
      - '{{.PKG_MGR}} --dir "{{.TASKFILE_DIR}}" run test'

  dev:
    desc: Run dev server with hot reload
    dir: "{{.TASKFILE_DIR}}"
    cmds:
      - task: ports
        vars: { PORTS: "4321" }
      - echo "Starting web dev server with hot reload..."
      - '{{.PKG_MGR}} --dir "{{.TASKFILE_DIR}}" run dev'

  preview:
    desc: Serve built site locally
    dir: "{{.TASKFILE_DIR}}"
    cmds:
      - task: ports
        vars: { PORTS: "4321" }
      - echo "Previewing built web site locally..."
      - '{{.PKG_MGR}} --dir "{{.TASKFILE_DIR}}" run preview'

  serve:
    desc: Serve built site (run build first if needed)
    dir: "{{.TASKFILE_DIR}}"
    cmds:
      - task: ports
        vars: { PORTS: "4321" }
      - echo "Serving built web site locally..."
      - '{{.PKG_MGR}} --dir "{{.TASKFILE_DIR}}" run preview'

  clean:
    desc: Remove build artifacts (dist) and node_modules
    dir: "{{.TASKFILE_DIR}}"
    cmds:
      - echo "Removing web build artifacts (dist, node_modules)..."
      - rm -rf dist
      - rm -rf node_modules

  clean:all:
    desc: Run clean and remove local .env
    dir: "{{.TASKFILE_DIR}}"
    deps: [clean]
    cmds:
      - echo "Removing web .env if present..."
      - rm -f .env
